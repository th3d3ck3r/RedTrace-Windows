name: Build RedTrace Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - '**.ps1'
      - 'Assets/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build self-contained Windows app
        shell: pwsh
        run: .\build.ps1
      - name: Verify packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path '.\\publish\\RedTrace.exe')) { throw 'Published RedTrace.exe was not produced.' }
          Get-Item '.\\publish\\RedTrace.exe' | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: RedTrace-Windows-x64
          path: publish\*

# CI rerun after TerminalView compilation fixes.
