name: Build RedTrace Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - '**.ps1'
      - 'Assets/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build self-contained Windows app
        shell: pwsh
        run: .\build.ps1
      - name: Smoke test packaged WinUI app
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'RedTrace\crash.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $process = Start-Process '.\publish\RedTrace.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(20000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $log) { Get-Content $log }
            throw 'RedTrace smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-3)} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'RedTrace|Microsoft.UI.Xaml' } |
              Select-Object -First 5 -ExpandProperty Message
            throw "RedTrace smoke test failed with exit code $($process.ExitCode)."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: RedTrace-Windows-x64
          path: publish\*

# CI rerun after TerminalView compilation fixes.
